name: Continuous Content Mining System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-next-run]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4
      with:
        clean: true # إجبار السيرفر على تنظيف الكاش والملفات القديمة تماماً عند البدء

    - name: 2. Set Node.js 24 Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 3. Run Execution Script
      run: node miner.js

    - name: 4. Self Trigger Loop
      if: always()
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://github.com{{ github.repository }}/dispatches \
          -d '{"event_type": "trigger-next-run"}'
