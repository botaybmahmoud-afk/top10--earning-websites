name: Continuous Content Mining System

on:
  schedule:
    - cron: '0 */1 * * *' # يعمل تلقائياً كل ساعة بشكل مستقر ومنظم لحماية حساب الإعلانات من الحظر
  workflow_dispatch: # تفعيل يدوي فوري بنقرة واحدة من هاتفك عند الحاجة

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. سحب الكود وتنظيف بيئة السيرفر
      uses: actions/checkout@v4
      with:
        clean: true

    - name: 2. تهيئة بيئة Node.js الحديثة والمستقرة
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. تشغيل ماكينة توليد واجهات الـ HTML
      run: node miner.js

    - name: 4. حفظ وتثبيت الواجهة الجديدة داخل المستودع تلقائياً
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ تحديث تلقائي لواجهة الهبوط وحقن الأرباح" && git push)
